<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>layout web menggunakan frameset</title>
</head>
<frameset rows="100, *, 50" frameborder="1" border="1" framespacing="0">
  <!-- header -->
   <frame src="/praktikum03/header.html" name="headerframe scroling">
     
     <!-- sidebar & main content -->
     <frameset cols="25%, 75%">
       <frame src="/pratikum 3/sidebar.html" name="showframe"></frame>
       <frame src="/pratikum 3/main.html" name="showframe"></frame>
       </frameset>
        
      <!-- footer -->
      <frame src="/pratikum 3/foooter.html"></frame>
      
</frameset>

</html>
